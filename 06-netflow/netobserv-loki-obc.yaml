# S3 bucket for the dedicated NetObserv LokiStack.
# After applying, NooBaa creates:
#   Secret:    loki-bucket (in ${NETOBSERV_NS}) — AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
#   ConfigMap: loki-bucket (in ${NETOBSERV_NS}) — BUCKET_HOST, BUCKET_PORT, BUCKET_NAME
#
# Applied via build-and-deploy.sh using envsubst. NETOBSERV_NS is detected at runtime.
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: loki-bucket
  namespace: ${NETOBSERV_NS}
spec:
  generateBucketName: loki-bucket
  storageClassName: ${OBC_STORAGE_CLASS}
