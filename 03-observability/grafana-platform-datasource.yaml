---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-platform-prometheus
  namespace: ${GRAFANA_NS}
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-platform-prometheus-token
  namespace: ${GRAFANA_NS}
  annotations:
    kubernetes.io/service-account.name: grafana-platform-prometheus
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: grafana-platform-prometheus-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-monitoring-view
subjects:
  - kind: ServiceAccount
    name: grafana-platform-prometheus
    namespace: ${GRAFANA_NS}
---
# GrafanaDataSource reads the bearer token from grafana-platform-bearer-token
# which is created by build-and-deploy.sh after the SA token is populated.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: prometheus-platform
  namespace: ${GRAFANA_NS}
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana-a
  datasource:
    name: prometheus-platform
    uid: prometheus-platform
    type: prometheus
    url: https://thanos-querier.openshift-monitoring.svc:9091
    access: proxy
    isDefault: false
    jsonData:
      httpMethod: POST
      tlsSkipVerify: true
      httpHeaderName1: "Authorization"
    secureJsonData:
      httpHeaderValue1: "Bearer ${PLATFORM_TOKEN}"
