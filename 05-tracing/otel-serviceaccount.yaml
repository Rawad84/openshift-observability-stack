---
# ServiceAccount used by the OTel Collector to authenticate with the Tempo gateway.
# The gateway runs in openshift multitenancy mode and requires a Bearer token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector-sa
  namespace: app-scenario
---
# Long-lived token for the ServiceAccount (for use in static env var injection).
apiVersion: v1
kind: Secret
metadata:
  name: otel-collector-sa-token
  namespace: app-scenario
  annotations:
    kubernetes.io/service-account.name: otel-collector-sa
type: kubernetes.io/service-account-token
