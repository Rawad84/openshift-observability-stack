---
# BuildConfig for frontend — builds from local source using binary strategy
# Run: oc start-build frontend --from-dir=apps/frontend --follow -n app-scenario
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: frontend
  namespace: app-scenario
spec:
  source:
    type: Binary
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: frontend:latest
