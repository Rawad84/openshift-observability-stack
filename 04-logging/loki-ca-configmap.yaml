---
# CA bundle for the CLF Vector collector to trust the LokiStack gateway's TLS certificate.
# The LokiStack gateway uses a service serving certificate signed by the OCP internal CA.
# OCP automatically injects the cluster CA bundle when this annotation is present.
# After applying, wait for the "service-ca.crt" key to be populated (~5-10s).
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-ca
  namespace: app-scenario
  annotations:
    service.beta.openshift.io/inject-cabundle: "true"
